<main class="tela">
  <form class="cartao glass" (ngSubmit)="entrar()">
    <h1>Estoque <span class="dourado">ICPA</span></h1>
    <p class="muted">Controle de itens de limpeza</p>

    <div class="campo">
      <label for="login">Login</label>
      <input
        id="login"
        name="login"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        [(ngModel)]="login"
        [disabled]="enviando()"
        required>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>

      <div class="senha">
        <input
          id="senha"
          name="senha"
          [type]="mostrarSenha() ? 'text' : 'password'"
          autocomplete="current-password"
          [(ngModel)]="senha"
          [disabled]="enviando()"
          required>

        <button
          class="senha__olho"
          type="button"
          [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
          [attr.aria-pressed]="mostrarSenha()"
          (click)="alternarSenha()">
          @if (mostrarSenha()) {
            <!-- olho cortado: senha visível, tocar esconde -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 2l20 20" />
              <path d="M6.7 6.7C4.6 8.1 3 10 2 12c2 3.9 5.6 6.5 10 6.5 1.9 0 3.6-.5 5.1-1.3" />
              <path d="M9.9 5.7A9.9 9.9 0 0 1 12 5.5c4.4 0 8 2.6 10 6.5-.8 1.6-2 3-3.4 4.1" />
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12c2-3.9 5.6-6.5 10-6.5S20 8.1 22 12c-2 3.9-5.6 6.5-10 6.5S4 15.9 2 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
    </div>

    @if (erro(); as mensagem) {
      <p class="erro" role="alert">{{ mensagem }}</p>
    }

    <button class="botao" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</main>
