<main class="tela">
  <form class="cartao glass" (ngSubmit)="entrar()">
    <h1>Estoque <span class="dourado">ICPA</span></h1>
    <p class="muted">Controle de itens de limpeza</p>

    <label class="campo">
      <span>Login</span>
      <input
        name="login"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        [(ngModel)]="login"
        [disabled]="enviando()"
        required>
    </label>

    <label class="campo">
      <span>Senha</span>
      <input
        name="senha"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="senha"
        [disabled]="enviando()"
        required>
    </label>

    @if (erro(); as mensagem) {
      <p class="erro" role="alert">{{ mensagem }}</p>
    }

    <button class="botao" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</main>
