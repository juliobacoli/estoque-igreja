<main class="tela">
  <form class="cartao glass" [@shake]="shakeState()" (ngSubmit)="entrar()">
    <h1>Estoque <span class="dourado">ICPA</span></h1>
    <p class="muted">Controle de itens de limpeza</p>

    <mat-form-field appearance="outline" class="campo-mat">
      <mat-label>Login</mat-label>
      <input
        matInput
        name="login"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        [(ngModel)]="login"
        [disabled]="enviando()"
        required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-mat">
      <mat-label>Senha</mat-label>
      <input
        matInput
        name="senha"
        [type]="mostrarSenha() ? 'text' : 'password'"
        autocomplete="current-password"
        [(ngModel)]="senha"
        [disabled]="enviando()"
        required>

      <button
        matSuffix
        mat-icon-button
        type="button"
        [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="mostrarSenha()"
        (click)="alternarSenha()">
        <mat-icon>{{ mostrarSenha() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    @if (erro(); as mensagem) {
      <p class="erro" role="alert">{{ mensagem }}</p>
    }

    <!-- Sem color="primary": obsoleto no M3, o botão já usa a primária do tema. -->
    <button mat-flat-button class="entrar" type="submit" [disabled]="enviando()">
      @if (enviando()) {
        <mat-progress-spinner diameter="20" mode="indeterminate" />
      } @else {
        Entrar
      }
    </button>
  </form>
</main>
