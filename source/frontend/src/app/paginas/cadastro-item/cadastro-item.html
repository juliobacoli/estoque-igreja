<h1>Cadastro de itens</h1>

<form class="cartao glass" [@shake]="shakeState()" (ngSubmit)="cadastrar()">
  <mat-form-field appearance="outline" class="campo-mat">
    <mat-label>Nome</mat-label>
    <input matInput name="nome" type="text" [(ngModel)]="nome" [disabled]="salvando()" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="campo-mat">
    <mat-label>Unidade</mat-label>
    <mat-select name="unidade" [(ngModel)]="unidade" [disabled]="salvando()" required>
      @for (opcao of unidades; track opcao) {
        <mat-option [value]="opcao">{{ opcao }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (erro(); as mensagem) {
    <p class="erro" role="alert">{{ mensagem }}</p>
  }

  <button mat-flat-button class="cadastrar" type="submit" [disabled]="salvando()">
    @if (salvando()) {
      <mat-progress-spinner diameter="20" mode="indeterminate" />
    } @else {
      Cadastrar item
    }
  </button>
</form>
