<mat-sidenav-container class="shell" [hasBackdrop]="true">
  <!-- mode="over" porque o app é só para celular (item 2.1): a gaveta cobre o
       conteúdo em vez de empurrá-lo. -->
  <mat-sidenav
    class="menu"
    mode="over"
    [opened]="menuAberto()"
    (openedChange)="menuAberto.set($event)">
    <p class="menu__perfil muted">Conectado como {{ perfil() }}</p>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="ativo" (click)="fecharMenu()">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/atualizar" routerLinkActive="ativo" (click)="fecharMenu()">
        <mat-icon matListItemIcon>edit</mat-icon>
        <span matListItemTitle>Atualizar Estoque</span>
      </a>

      <!-- Só o Admin enxerga o cadastro. A barreira real é o 403 do servidor. -->
      @if (ehAdmin()) {
        <a mat-list-item routerLink="/cadastro" routerLinkActive="ativo" (click)="fecharMenu()">
          <mat-icon matListItemIcon>add_box</mat-icon>
          <span matListItemTitle>Cadastro de Itens</span>
        </a>
      }

      <a mat-list-item routerLink="/historico" routerLinkActive="ativo" (click)="fecharMenu()">
        <mat-icon matListItemIcon>history</mat-icon>
        <span matListItemTitle>Histórico</span>
      </a>
    </mat-nav-list>

    <button mat-stroked-button class="menu__sair" type="button" (click)="sair()">
      <mat-icon>logout</mat-icon>
      Sair
    </button>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="cabecalho">
      <button mat-icon-button aria-label="Abrir menu" (click)="alternarMenu()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="marca">Estoque <strong class="dourado">ICPA</strong></span>
    </mat-toolbar>

    <main class="container">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
