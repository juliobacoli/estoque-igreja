name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um push novo no mesmo PR cancela o run anterior, que ficou desatualizado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EstoqueIgreja.sln

      - name: Build
        run: dotnet build EstoqueIgreja.sln --no-restore -c Release

      - name: Testes unitários
        run: dotnet test EstoqueIgreja.UnitTests --no-build -c Release

      # O runner Linux do GitHub já tem Docker, que o Testcontainers usa para subir o PostgreSQL.
      - name: Testes de integração
        run: dotnet test EstoqueIgreja.IntegrationTests --no-build -c Release

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários
        run: npm test -- --no-watch --no-progress

      - name: Build
        run: npm run build -- --configuration production

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/e2e/package-lock.json

      # Mesma imagem de produção do Dockerfile, contra um PostgreSQL descartável.
      - name: Subir app e banco
        run: docker compose up -d --build --wait

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npx playwright test

      - name: Logs do app
        if: failure()
        run: docker compose logs app

      # Relatório com screenshot, vídeo e trace dos testes que falharam.
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: source/e2e/playwright-report/
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Só valida que a imagem de deploy continua buildando; nada é publicado.
      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
